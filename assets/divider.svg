<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28">
<style>
 text { font-family: Georgia,'Times New Roman',serif; }
 .mono { font-family: 'Courier New',monospace; }
 .tw { animation: tw ease-in-out infinite; } @keyframes tw { 50% { opacity:.12; } }
 @keyframes spin { to { transform: rotate(360deg); } } @keyframes spinr { to { transform: rotate(-360deg); } }
 .ring { animation: spin 60s linear infinite; }
 .flick { animation: fl 5s infinite; } @keyframes fl { 0%,40%,44%,48%,100% { opacity:1; } 42%,46% { opacity:.4; } }
 .esc { animation: esc 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes esc { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(8px,-8px) scale(1.05); } }
 .beam { animation: beam 3s ease-in-out infinite; } @keyframes beam { 50% { opacity:.35; } }
 .glitch { animation: gl 4s infinite; } @keyframes gl { 0%,90%,100% { transform: translate(0,0); } 92% { transform: translate(-4px,1px); } 95% { transform: translate(4px,-1px); } }
 .crawl { animation: crawl 14s linear infinite; } @keyframes crawl { from { transform: translateX(0); } to { transform: translateX(-600px); } }
</style>
<rect width="1200" height="28" fill="#07070a"/><rect y="0" width="1200" height="2" fill="#c1121f"/><rect y="26" width="1200" height="2" fill="#c1121f"/>
