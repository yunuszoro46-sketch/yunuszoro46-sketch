<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="330" viewBox="0 0 1500 330" role="img" aria-label="stayon: generator rosters for load-shedding days. Team project, UAP HackApex. JavaScript, Node.js."><title>stayon: generator rosters for load-shedding days. Team project, UAP HackApex. JavaScript, Node.js.</title><g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"><rect x="1" y="1" width="1498" height="328" rx="14" fill="#070b09" stroke="#10b981" stroke-opacity=".45" stroke-width="2"/><text x="48" y="66" font-size="30" font-weight="700" fill="#4ade80">stayon<tspan fill="#5f7a6d">/</tspan></text><rect x="1109" y="40" width="211" height="34" rx="6" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".7"/><text x="1124" y="63" font-size="20" fill="#34d399">team · HackApex</text><text x="1452" y="63" text-anchor="end" font-size="18" fill="#5f7a6d">-rwxr-xr-x</text><text x="48" y="122" font-size="24" fill="#9fb3aa" xml:space="preserve">Generator rosters for load-shedding days. Finds a <tspan fill="#4ade80">provably optimal</tspan></text><text x="48" y="160" font-size="24" fill="#9fb3aa" xml:space="preserve">schedule under capacity and diesel limits, and explains every</text><text x="48" y="198" font-size="24" fill="#9fb3aa" xml:space="preserve">shop left dark with real numbers. <tspan fill="#4ade80">39 tests</tspan>, zero dependencies.</text><rect x="48.0" y="242" width="146.4" height="36" rx="6" fill="#0a110d" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.5"/><text x="61.0" y="267" font-size="20" fill="#4ade80">javascript</text><rect x="206.4" y="242" width="110.3" height="36" rx="6" fill="#0a110d" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.5"/><text x="219.4" y="267" font-size="20" fill="#4ade80">node.js</text><rect x="328.7" y="242" width="170.5" height="36" rx="6" fill="#0a110d" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.5"/><text x="341.7" y="267" font-size="20" fill="#4ade80">optimization</text><rect x="511.2" y="242" width="134.4" height="36" rx="6" fill="#0a110d" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.5"/><text x="524.2" y="267" font-size="20" fill="#4ade80">node:test</text><text x="48" y="300" font-size="20" fill="#34d399">→ live demo   → source   <tspan fill="#5f7a6d">(links below)</tspan></text></g></svg>